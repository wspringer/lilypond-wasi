# Publish one variant, on a tag that says exactly what it is.
#
#   stable/2.26.1-p0.1.0    LilyPond 2.26.1 (stable line), built by recipe 0.1.0
#   dev/2.27.4-p0.1.0       LilyPond 2.27.4 (development line), same recipe
#
# Two independent things trigger a release — upstream moving, or our own
# patches/overlay/build flags changing — so the tag carries both axes. One
# release per variant, so an upstream change on master never republishes an
# unchanged stable artifact under a new name.
#
# `dev/*` publishes as a pre-release, so GitHub's "Latest" always points at
# the stable line, matching what LilyPond itself means by the two series.
#
# The recipe version lives in ./recipe-version and is asserted against the
# tag: a tag can never claim to ship something it doesn't.
name: release

on:
  push:
    tags:
      - "dev/*"
      - "stable/*"
  # tag-releases.yml dispatches with the tag as input: refs it creates with
  # GITHUB_TOKEN do not fire the push trigger above.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. stable/2.26.1-p0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: lilypond-wasi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Parse and verify the tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"   # e.g. dev/2.27.4-p0.1.0
          variant="${tag%%/*}"                      # dev | stable
          rest="${tag#*/}"                          # 2.27.4-p0.1.0
          claimed_upstream="${rest%-p*}"            # 2.27.4
          claimed_recipe="${rest##*-p}"             # 0.1.0

          case "$variant" in
            dev)    attr=lilypond ;;
            stable) attr=lilypond-stable ;;
            *) echo "::error::tag must start with dev/ or stable/, got '$variant'"; exit 1 ;;
          esac

          # The recipe version is declared in the repo; the tag must agree.
          declared_recipe="$(tr -d '[:space:]' < recipe-version)"
          if [ "$claimed_recipe" != "$declared_recipe" ]; then
            echo "::error::tag claims recipe $claimed_recipe, ./recipe-version says $declared_recipe"
            exit 1
          fi

          # The upstream version is derived from the pinned source; the tag
          # must agree with that too, so a tag cannot misdescribe its content.
          full="$(nix eval --raw ".#$attr.version")"   # 2.27.4+g32e3cc2
          actual_upstream="${full%%+*}"
          rev="${full##*+}"
          if [ "$claimed_upstream" != "$actual_upstream" ]; then
            echo "::error::tag claims LilyPond $claimed_upstream, the pin builds $actual_upstream"
            exit 1
          fi

          {
            echo "variant=$variant"
            echo "attr=$attr"
            echo "upstream=$actual_upstream"
            echo "rev=$rev"
            echo "recipe=$declared_recipe"
            echo "slug=$actual_upstream-$variant"
            echo "prerelease=$([ "$variant" = dev ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          nix build ".#${{ steps.tag.outputs.attr }}" -o result-engine
          nix build ".#$([ '${{ steps.tag.outputs.variant }}' = dev ] && echo assets || echo assets-stable)" -o result-assets
          nix build ".#$([ '${{ steps.tag.outputs.variant }}' = dev ] && echo bytecode || echo bytecode-stable)" -o result-bytecode

      - name: Verify the module engraves before publishing it
        run: |
          set -euo pipefail
          guile=$(nix build '.#wasi-guile.out' --print-out-paths)
          mkdir -p work/home work/tmp work/cache/fontconfig work/lily-lib
          printf '\\version "%s"\n{ c%s e%s g%s }\n' "${{ steps.tag.outputs.upstream }}" "'" "'" "'" > work/in.ly
          nix develop --command wasmtime run \
            -W exceptions=y -C cache=n \
            --dir "$PWD/work::/work" \
            --dir "$PWD/result-assets/share/lilypond::/lilypond" \
            --dir "$guile/share/guile/3.0::/guile" \
            --dir "$guile/lib/guile/3.0/ccache::/guile-ccache" \
            --env FONTCONFIG_FILE=/lilypond/fonts/fonts.conf \
            --env GUILE_LOAD_PATH=/guile \
            --dir "$PWD/result-bytecode/ccache::/lily-ccache" \
            --env GUILE_LOAD_COMPILED_PATH=/guile-ccache:/lily-ccache \
            --env GUILE_SYSTEM_PATH=/guile \
            --env GUILE_SYSTEM_COMPILED_PATH=/guile-ccache \
            --env HOME=/work/home --env LILYPOND_DATADIR=/lilypond \
            --env LILYPOND_LIBDIR=/work/lily-lib --env TMPDIR=/work/tmp \
            --env XDG_CACHE_HOME=/work/cache --argv0 /lilypond \
            result-engine/bin/lilypond.wasm --formats=svg -o /work/out /work/in.ly
          test -s work/out.svg
          echo "engraved $(wc -c < work/out.svg) bytes — publishing"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          slug="${{ steps.tag.outputs.slug }}"
          mkdir -p dist
          cp result-engine/bin/lilypond.wasm "dist/lilypond-wasi-$slug.wasm"
          tar -C result-assets/share -czf "dist/lilypond-wasi-assets-$slug.tar.gz" lilypond
          tar -C result-bytecode -czf "dist/lilypond-wasi-bytecode-$slug.tar.gz" ccache
          cat > dist/provenance.json <<EOF
          {
            "variant": "${{ steps.tag.outputs.variant }}",
            "lilypond": "${{ steps.tag.outputs.upstream }}",
            "lilypondRevision": "${{ steps.tag.outputs.rev }}",
            "recipe": "${{ steps.tag.outputs.recipe }}",
            "tag": "${{ inputs.tag || github.ref_name }}",
            "repository": "${{ github.server_url }}/${{ github.repository }}"
          }
          EOF
          ( cd dist && shasum -a 256 * > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Release notes
        run: |
          cat > notes.md <<EOF
          LilyPond **${{ steps.tag.outputs.upstream }}** (${{ steps.tag.outputs.variant }} line,
          upstream \`${{ steps.tag.outputs.rev }}\`) compiled to \`wasm32-unknown-wasi\`,
          built by recipe \`${{ steps.tag.outputs.recipe }}\`.

          Verified on this runner: the module engraves SVG under wasmtime before publishing.

          ## Running it

          Needs a WASI Preview 1 host with WebAssembly exception handling (the
          module uses the modern \`try_table\`/\`exnref\` encoding), the asset tree
          mounted, and Guile's Scheme library available:

          \`\`\`
          wasmtime run -W exceptions=y \\
            --dir "\$PWD/work::/work" \\
            --dir "\$PWD/lilypond::/lilypond" \\
            --dir "<guile>/share/guile/3.0::/guile" \\
            --dir "<guile>/lib/guile/3.0/ccache::/guile-ccache" \\
            --env LILYPOND_DATADIR=/lilypond \\
            --env FONTCONFIG_FILE=/lilypond/fonts/fonts.conf \\
            --env GUILE_LOAD_PATH=/guile \\
            --env GUILE_LOAD_COMPILED_PATH=/guile-ccache \\
            --env GUILE_SYSTEM_PATH=/guile \\
            --env GUILE_SYSTEM_COMPILED_PATH=/guile-ccache \\
            --env HOME=/work/home --env TMPDIR=/work/tmp \\
            --env XDG_CACHE_HOME=/work/cache \\
            --argv0 /lilypond \\
            lilypond-wasi-${{ steps.tag.outputs.slug }}.wasm \\
            --formats=svg -o /work/out /work/in.ly
          \`\`\`

          Mounting the bytecode tarball as `/lily-ccache` (and appending
          `:/lily-ccache` to `GUILE_LOAD_COMPILED_PATH`) cuts startup ~5x —
          measured 4.7 s -> 0.9 s for a small score.

          Formats are **SVG and EPS**. PDF and PNG need Ghostscript, which cannot
          run under WASI — convert host-side, or use native LilyPond.

          Nix users need none of this: the flake's \`nixConfig\` points at
          \`lilypond-wasi.cachix.org\` (pass \`--accept-flake-config\`).
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          body_path: notes.md
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          # keep "Latest" pointing at the stable line even when the knope
          # bot's recipe releases or dev pre-releases land afterwards
          make_latest: ${{ steps.tag.outputs.variant == 'stable' && 'true' || 'false' }}
          name: "LilyPond ${{ steps.tag.outputs.upstream }} (${{ steps.tag.outputs.variant }}) — recipe ${{ steps.tag.outputs.recipe }}"
