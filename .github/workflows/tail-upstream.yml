# Tailing regression check: does our patch series still apply to upstream
# LilyPond master, and does the stack still build?
#
# Runs on Linux only, deliberately. Nix binary caches are per-system, so
# x86_64-linux artifacts do NOT help an aarch64-darwin laptop — macOS
# runners would, but bill at 10x on a private repo. What this workflow is
# actually for is the early-warning signal: upstream moved and our patches
# stopped applying. That signal is system-independent.
#
# NOTE: the stack has so far only ever been built on aarch64-darwin. The
# first Linux run may surface fixes; that is the point.
name: tail upstream

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "patches/**"

jobs:
  patches-still-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Advance the upstream pin
        run: nix flake update lilypond-src

      - name: Patch series applies to upstream tip
        run: nix build .#source --no-link --print-build-logs

      - name: Report the pinned revision
        run: |
          nix flake metadata --json |
            jq -r '.locks.nodes["lilypond-src"].locked |
                   "upstream: \(.rev) (\(.lastModified | todate))"'

  build-stack:
    runs-on: ubuntu-latest
    needs: patches-still-apply
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Populates the cache with x86_64-linux artifacts. With no token the
      # action still configures the substituter and simply skips pushing,
      # so no conditional is needed (and a step-level `env` would not be
      # visible to `if` anyway).
      - uses: cachix/cachix-action@v15
        with:
          name: lilypond-wasi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Dependency stack
        run: nix build .#wasi-deps --no-link --print-build-logs

      - name: Engine
        run: nix build .#lilypond --no-link --print-build-logs

      - name: Engrave smoke test
        run: |
          nix build .#lilypond .#assets
          echo "stack + engine built on $(uname -m)-linux"

  # aarch64-darwin artifacts — the ones a Mac laptop can actually use.
  # Free runners now that the repo is public; mostly cache hits, since the
  # cache is already populated.
  build-macos:
    runs-on: macos-14
    needs: patches-still-apply
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: lilypond-wasi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Dependency stack
        run: nix build .#wasi-deps --no-link --print-build-logs

      - name: Engine + assets
        run: nix build .#lilypond .#assets --no-link --print-build-logs

      - name: Engrave a score inside wasmtime
        run: |
          nix build .#lilypond -o result-lilypond
          nix build .#assets   -o result-assets
          guile=$(nix build '.#wasi-guile.out' --print-out-paths)
          mkdir -p work/home work/tmp work/cache/fontconfig work/lily-lib
          printf '\\version "2.27.3"\n{ c%s e%s g%s }\n' "'" "'" "'" > work/in.ly
          nix develop --command wasmtime run \
            -W exceptions=y -C cache=n \
            --dir "$PWD/work::/work" \
            --dir "$PWD/result-assets/share/lilypond::/lilypond" \
            --dir "$guile/share/guile/3.0::/guile" \
            --dir "$guile/lib/guile/3.0/ccache::/guile-ccache" \
            --env FONTCONFIG_FILE=/lilypond/fonts/fonts.conf \
            --env GUILE_LOAD_PATH=/guile \
            --env GUILE_LOAD_COMPILED_PATH=/guile-ccache \
            --env GUILE_SYSTEM_PATH=/guile \
            --env GUILE_SYSTEM_COMPILED_PATH=/guile-ccache \
            --env HOME=/work/home --env LILYPOND_DATADIR=/lilypond \
            --env LILYPOND_LIBDIR=/work/lily-lib --env TMPDIR=/work/tmp \
            --env XDG_CACHE_HOME=/work/cache --argv0 /lilypond \
            result-lilypond/bin/lilypond.wasm \
            --formats=svg -o /work/out /work/in.ly
          test -s work/out.svg
          echo "engraved $(wc -c < work/out.svg) bytes of SVG on $(uname -m)-darwin"
